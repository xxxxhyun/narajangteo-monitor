name: 나라장터 키워드 모니터링
run-name: "${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.mode, inputs.request_id) || '예약 확인' }}"

on:
  schedule:
    # 매일 30분마다(17분·47분) 깨어나서, config.json 의 발송 요일·시각이 지났고 아직 안 보냈을 때만 보냅니다.
    # GitHub 예약 실행은 몇 시간씩 늦거나 건너뛰는 일이 잦아 자주 깨웁니다. (발송 시각이 아니면 API 호출 없이 몇 초 만에 종료)
    # 발송 시각은 설정 웹페이지에서 바꾸세요. 이 파일은 수정할 필요 없습니다.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "scheduled=예약과 동일 / preview=미리보기(슬랙 X) / send=슬랙으로 테스트 전송"
        type: choice
        options: [preview, send, scheduled]
        default: preview
      lookback_hours:
        description: "조회 기간(시간). 테스트 기본 24"
        required: false
        default: ""
      request_id:
        description: "설정 웹페이지가 결과를 찾기 위한 값 (비워둬도 됨)"
        required: false
        default: ""

permissions:
  contents: write   # 발송 기록(state.json)·미리보기 결과 저장용

concurrency:
  group: narajangteo
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 나라장터 조회
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MODE: ${{ inputs.mode || 'scheduled' }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 monitor.py

      - name: 기록 저장
        if: always()
        run: |
          git add -A state.json previews 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "g2b-monitor-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "${{ inputs.mode == 'preview' && '미리보기 결과' || '발송 기록' }} $(TZ=Asia/Seoul date '+%F %H:%M')"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
